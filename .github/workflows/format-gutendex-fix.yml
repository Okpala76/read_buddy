name: Format Gutendex error fix
on:
  push:
    branches: [fix/readon-gutendex-search-errors]
    paths: [.github/workflows/format-gutendex-fix.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readon-gutendex-search-errors
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/features/books/ui/free-book-actions.ts src/features/books/ui/components/FreeBookDiscovery.tsx
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/books
          git diff --cached --quiet || git commit -m 'style: format Gutendex error handling'
          git push
