name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Release action
        required: true
        default: release
        type: choice
        options:
          - release
          - migrations-only
          - status-only

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Production release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production

    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'release' }}
      PRODUCTION_URL: https://read-buddy.ogalandlord.com.ng
      SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Reject a stale or ineligible release
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git rev-parse origin/main)"
          checked_out="$(git rev-parse HEAD)"
          if [[ "$checked_out" != "$RELEASE_SHA" || "$checked_out" != "$current_main" ]]; then
            echo "Release commit must be the current main HEAD."
            echo "requested=$RELEASE_SHA checked_out=$checked_out main=$current_main"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x

      - name: Confirm CI passed for a manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successful_runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&head_sha=${RELEASE_SHA}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "No successful CI run exists for $RELEASE_SHA."
            exit 1
          fi

      - name: Build migration bundle
        shell: bash
        env:
          MIGRATION_BUNDLE_HMAC_KEY: ${{ secrets.MIGRATION_BUNDLE_HMAC_KEY }}
        run: |
          set -euo pipefail
          : "${MIGRATION_BUNDLE_HMAC_KEY:?Set the MIGRATION_BUNDLE_HMAC_KEY secret}"
          mkdir -p .release
          node scripts/release/create-migration-manifest.mjs .release/migrations.tsv
          tar -czf .release/migrations.tgz \
            .release/migrations.tsv \
            src/db/migrations/meta/_journal.json \
            src/db/migrations/*.sql
          node scripts/release/sign-migration-bundle.mjs \
            "$RELEASE_SHA" \
            .release/migrations.tgz \
            .release/migrations.hmac

      - name: Configure verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set the PRODUCTION_SSH_HOST environment variable}"
          : "${SSH_PORT:?Set the PRODUCTION_SSH_PORT environment variable}"
          : "${SSH_USER:?Set the PRODUCTION_SSH_USER environment variable}"
          : "${SSH_PRIVATE_KEY:?Set the PRODUCTION_SSH_PRIVATE_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Set the PRODUCTION_SSH_KNOWN_HOSTS secret}"
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/read_buddy_deploy"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/read_buddy_deploy"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "[$SSH_HOST]:$SSH_PORT" -f "$HOME/.ssh/known_hosts" >/dev/null || \
            ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Reconcile production migrations
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$HOME/.ssh/read_buddy_deploy"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          remote="${SSH_USER}@${SSH_HOST}"
          ssh "${ssh_options[@]}" "$remote" \
            "stage-bundle $RELEASE_SHA" < .release/migrations.tgz
          ssh "${ssh_options[@]}" "$remote" \
            "stage-signature $RELEASE_SHA" < .release/migrations.hmac

          database_mode=apply
          if [[ "$RELEASE_MODE" == "status-only" ]]; then
            database_mode=status
          fi
          ssh "${ssh_options[@]}" "$remote" \
            "reconcile $RELEASE_SHA $database_mode"

      - name: Set up pnpm
        if: env.RELEASE_MODE == 'release'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.27.0
          run_install: false

      - name: Pull Vercel production settings
        if: env.RELEASE_MODE == 'release'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN secret}"
          : "${VERCEL_ORG_ID:?Set the VERCEL_ORG_ID environment variable}"
          : "${VERCEL_PROJECT_ID:?Set the VERCEL_PROJECT_ID environment variable}"
          pnpm dlx vercel@62.1.0 pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Build the production candidate
        if: env.RELEASE_MODE == 'release'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_SLUG: Okpala76/read_buddy
          VERCEL_GIT_COMMIT_REF: main
          VERCEL_GIT_COMMIT_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          pnpm dlx vercel@62.1.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy without assigning production domains
        if: env.RELEASE_MODE == 'release'
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_SLUG: Okpala76/read_buddy
          VERCEL_GIT_COMMIT_REF: main
          VERCEL_GIT_COMMIT_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          deployment_url="$(pnpm dlx vercel@62.1.0 deploy \
            --prebuilt \
            --prod \
            --skip-domain \
            --env="RELEASE_SHA=$RELEASE_SHA" \
            --meta="githubCommitSha=$RELEASE_SHA" \
            --meta="githubCommitRef=main" \
            --token="$VERCEL_TOKEN")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          pnpm dlx vercel@62.1.0 inspect "$deployment_url" \
            --wait \
            --timeout=10m \
            --token="$VERCEL_TOKEN"

      - name: Verify the production candidate
        if: env.RELEASE_MODE == 'release'
        shell: bash
        env:
          HEALTH_CHECK_SECRET: ${{ secrets.PRODUCTION_HEALTH_CHECK_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: >-
          node scripts/release/check-health.mjs
          "${{ steps.deploy.outputs.deployment_url }}"
          "$RELEASE_SHA"

      - name: Promote the verified candidate
        if: env.RELEASE_MODE == 'release'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]]; then
            echo "main advanced while this release was running; refusing promotion."
            exit 1
          fi
          pnpm dlx vercel@62.1.0 promote \
            "${{ steps.deploy.outputs.deployment_url }}" \
            --yes \
            --timeout=10m \
            --token="$VERCEL_TOKEN"

      - name: Verify production
        if: env.RELEASE_MODE == 'release'
        shell: bash
        env:
          HEALTH_CHECK_SECRET: ${{ secrets.PRODUCTION_HEALTH_CHECK_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/release/check-health.mjs "$PRODUCTION_URL" "$RELEASE_SHA"

      - name: Remove the remote release bundle
        if: always()
        shell: bash
        run: |
          if [[ -z "${SSH_HOST:-}" || -z "${SSH_PORT:-}" || -z "${SSH_USER:-}" ]]; then
            exit 0
          fi
          ssh \
            -i "$HOME/.ssh/read_buddy_deploy" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}" \
            "cleanup ${RELEASE_SHA}" || true
