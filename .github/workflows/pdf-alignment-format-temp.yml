name: Format physical PDF alignment temporary
on:
  push:
    branches: [feat/pdf-physical-reading-alignment]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/pdf-physical-reading-alignment
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.27.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/db/schema/pdf-reading-states.ts src/db/schema/reading-sessions.ts src/features/book-documents/ui/pdf-reading-actions.ts src/features/book-documents/ui/PdfReader.tsx src/features/reading/domain/reading-session.ts src/features/reading/infrastructure/drizzle-reading-session-repository.ts src/features/reading/ui/reading-session-view.ts src/features/reading/ui/components/SessionList.tsx src/features/books/ui/book-view.ts src/features/books/ui/components/BookCard.tsx "src/app/(app)/books/page.tsx"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "style: format PDF reading alignment feature"
            git push origin HEAD:feat/pdf-physical-reading-alignment
          fi
