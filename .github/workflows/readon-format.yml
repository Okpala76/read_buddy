name: ReadOn branch formatting

on:
  push:
    branches:
      - feat/readon-r2-storage
    paths:
      - .github/workflows/readon-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/readon-r2-storage
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/READON_R2_STORAGE.md src/features/book-documents
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/READON_R2_STORAGE.md src/features/book-documents
          if ! git diff --cached --quiet; then
            git commit -m "style: format ReadOn storage files"
            git push origin HEAD:feat/readon-r2-storage
          fi
