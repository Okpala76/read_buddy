name: Format EPUB location fix temporary
on:
  push:
    branches: [fix/epub-progress-display]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/epub-progress-display
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.27.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/types/epubjs.d.ts src/features/book-documents/ui/EpubReader.tsx src/features/book-documents/ui/epub-position-actions.ts src/features/books/ui/book-view.ts src/features/books/ui/components/BookCard.tsx 'src/app/(app)/books/page.tsx'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "style: format EPUB location fix"
            git push origin HEAD:fix/epub-progress-display
          fi
