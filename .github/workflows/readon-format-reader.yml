name: Format embedded reader
on:
  workflow_dispatch:
  push:
    branches: [feat/readon-embedded-pdf-reader]
    paths: [.github/workflows/readon-format-reader.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/readon-embedded-pdf-reader
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/features/book-documents/ui/BookDocumentControl.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/book-documents/ui/BookDocumentControl.tsx
          git diff --cached --quiet || git commit -m "style: apply Prettier to embedded PDF reader"
          git push origin HEAD:feat/readon-embedded-pdf-reader
