name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      DATABASE_SSL: disable
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate R2 dependencies and format feature branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/r2-document-storage'
        run: |
          pnpm add @aws-sdk/client-s3 @aws-sdk/s3-request-presigner
          pnpm exec prettier --write src/features/book-storage .env.example docs/IN_APP_READING_ARCHITECTURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml src/features/book-storage docs/IN_APP_READING_ARCHITECTURE.md
          git commit -m "build: add AWS S3-compatible client and format R2 foundation"
          git push origin HEAD:${{ github.head_ref }}

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: read_buddy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d read_buddy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/read_buddy_test
      DATABASE_SSL: disable
      DATABASE_POOL_MAX: "10"
      RUN_DATABASE_INTEGRATION_TESTS: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply historical migrations sequentially
        run: node scripts/ci-apply-migrations.mjs

      - name: Test production migration reconciliation
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          staging_root="$RUNNER_TEMP/releases"
          staging_dir="$staging_root/$release_sha"
          bundle_root="$RUNNER_TEMP/bundle"
          hmac_key='ci-only-release-bundle-key-32-bytes-minimum'

          mkdir -p "$staging_dir" "$bundle_root/.release"
          node scripts/release/create-migration-manifest.mjs \
            "$bundle_root/.release/migrations.tsv"
          tar -czf "$staging_dir/migrations.tgz" \
            -C "$bundle_root" .release/migrations.tsv \
            -C "$GITHUB_WORKSPACE" src/db/migrations/meta/_journal.json \
            src/db/migrations/*.sql
          MIGRATION_BUNDLE_HMAC_KEY="$hmac_key" \
            node scripts/release/sign-migration-bundle.mjs \
              "$release_sha" \
              "$staging_dir/migrations.tgz" \
              "$staging_dir/migrations.hmac"
          printf '%s' "$hmac_key" > "$RUNNER_TEMP/migration-hmac-key"
          chmod 600 "$RUNNER_TEMP/migration-hmac-key"

          docker exec "$POSTGRES_CONTAINER" createdb \
            --username=postgres read_buddy_reconciler_test
          common_environment=(
            READ_BUDDY_RELEASE_CONFIG=/dev/null
            READ_BUDDY_BACKUP_COMMAND=/usr/bin/true
            POSTGRES_CONTAINER="$POSTGRES_CONTAINER"
            POSTGRES_DATABASE=read_buddy_reconciler_test
            MIGRATION_ROLE=postgres
            DATABASE_MAINTENANCE_LOCK_FILE="$RUNNER_TEMP/database-maintenance.lock"
            MIGRATION_LOCK_WAIT_SECONDS=0
            RELEASE_STAGING_ROOT="$staging_root"
            BUNDLE_HMAC_KEY_FILE="$RUNNER_TEMP/migration-hmac-key"
          )
          env "${common_environment[@]}" \
            bash ops/vps/reconcile-migrations.sh "$staging_dir" apply
          env "${common_environment[@]}" \
            bash ops/vps/reconcile-migrations.sh "$staging_dir" apply

      - name: Run PostgreSQL concurrency tests
        run: >-
          pnpm exec vitest run
          src/features/reminders/infrastructure/drizzle-reminder-concurrency.integration.test.ts
